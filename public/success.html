<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erfolgreich - Chapter hinzugefügt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #a71c1c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .message {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .search-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 25px;
            margin: 30px 0;
        }
        
        .search-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .search-form input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .search-form input:focus {
            outline: none;
            border-color: #a71c1c;
        }
        
        .search-form button {
            padding: 12px 25px;
            background: #a71c1c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .search-form button:hover {
            background: red;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: 2px solid #a71c1c;
            background: white;
            color: #a71c1c;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:hover {
            background: #a71c1c;
            color: white;
        }
        
        .btn-primary {
            background: #a71c1c;
            color: white;
            border-color: #a71c1c;
        }
        
        .btn-primary:hover {
            background: red;
            border-color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Erfolgreich hinzugefügt!</h1>
        <p class="message">
            Vielen Dank für die Nutzung der Extension. 
        </p>
        <div class="search-section">
            <h2>Im RI Opac suchen</h2>
            <form class="search-form" action="https://opac.regesta-imperii.de/lang_de/suche.php" method="get" target="_blank">
                <input 
                    type="text" 
                    name="qs" 
                    placeholder="Suchbegriff eingeben..." 
                    required
                    autocomplete="off"
                >
                <button type="submit">Suchen</button>
            </form>
        </div>
        
        <div class="button-group">
            <a href='https://ko-fi.com/P5P2Y9CL5' target='_blank'><img height='36' style='border:0px;height:36px;'
                    src='./support_me_on_kofi_blue.png' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
        </div>
    </div>
    <script src="success.js"></script>
</body>
</html>
